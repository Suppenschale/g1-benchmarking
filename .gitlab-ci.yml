stages:
  - benchmark

variables:
  PYTHONUNBUFFERED: "true"

.shared-scripts:
  install-deps: &INSTALL_DEPS |
    echo "Installing any kind of dependencies"

  run-benchmarks: &RUN_BENCHMARKS |
    echo "Running benchmarks"
    cd awfy/benchmarks/Java
    java -cp benchmarks.jar Harness Sieve 10 10000 | tee results.txt

before_script:
  - sudo reown-project.sh || true


benchmark-y1:
  stage: benchmark
  tags: [kent-yuria]
  script:
    - *INSTALL_DEPS
    - *RUN_BENCHMARKS
  artifacts: {paths: [awfy/benchmarks/Java/results.txt], expire_in: 1 week}

