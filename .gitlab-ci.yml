stages:
  - build
  - benchmark


variables:
  JDK_DIR: "$CI_PROJECT_DIR/jdk"


build-jdk:
  stage: build
  tags:
    - kent-yuria
  script:
    - sudo apt-get update
    - sudo apt-get install -y libasound2-dev
    - git clone --branch survivor https://github.com/Suppenschale/jdk.git jdk
    - cd jdk
    - bash configure
    - make images
  artifacts:
    paths:
      - jdk/build/*/images/jdk
    expire_in: 1 week


benchmark:
  stage: benchmark
  tags:
    - kent-yuria
  script:
    - chmod +x benchmarks/run.sh
    - ./benchmarks/run.sh