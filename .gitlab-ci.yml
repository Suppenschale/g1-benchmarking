stages:
  - benchmark

benchmark:
  stage: benchmark
  tags:
    - kent-yuria

  timeout: 2 days

  artifacts:
    when: always
    paths:
      - results/
    expire_in: 30 days

  script:
    - echo "Extracting custom JDK"
    - tar -xzf jdk/my-jdk.tar.gz

    - echo "Testing JDK"
    - ./jdk/bin/java -version

    - cd benchmarks

    - echo "Checking DaCapo"
    - |
      if [ ! -f "dacapo-23.11-chopin.jar" ] || [ ! -d "dacapo-23.11-chopin" ]; then
        echo "DaCapo not found. Downloading..."
        wget --no-verbose -O dacapo.zip \
          "https://download.dacapobench.org/chopin/dacapo-23.11-chopin.zip"
        unzip -q dacapo.zip
        rm dacapo.zip
      else
        echo "DaCapo already exists. Skipping download."
      fi

    - echo "Checking Renaissance"
    - |
      if [ ! -f "renaissance-gpl-0.16.1.jar" ]; then
        echo "Renaissance not found. Downloading..."
        wget --no-verbose -O renaissance-gpl-0.16.1.jar \
          "https://github.com/renaissance-benchmarks/renaissance/releases/download/v0.16.1/renaissance-gpl-0.16.1.jar"
      else
        echo "Renaissance already exists. Skipping download."
      fi

    - echo "Benchmark files:"
    - ls -lh
    - ls -lh dacapo-23.11-chopin

    - echo "Running benchmarks"
    - ./benchmark.sh ../jdk

    - cd ../results

    - gzip gc_stats.csv
    - gzip runtime_stats.csv
    - gzip timing_stats.csv